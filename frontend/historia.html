<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>História — Aldeia de Agentes</title>
  <link rel="stylesheet" href="css/estilo.css?v=14">
  <style>
    /* Estilos específicos da narrativa */
    .narrativa-capitulo {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: var(--radius-md);
      padding: 18px 22px;
      margin: 18px 0;
      transition: border-color var(--transition);
    }
    .narrativa-capitulo:hover { border-color: var(--border-hover); }
    .narrativa-capitulo.inverno { border-left-color: var(--info); }
    .narrativa-capitulo.crise { border-left-color: var(--danger); }
    .narrativa-capitulo.fartura { border-left-color: var(--success); }
    .narrativa-capitulo.epilogo { border-left-color: var(--warning); }

    .capitulo-num {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .capitulo-titulo {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      margin: 0 0 12px 0;
      letter-spacing: -0.01em;
    }
    .capitulo-titulo .estacao-tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      margin-left: 8px;
      vertical-align: middle;
    }
    .estacao-tag.normal { background: var(--surface-3); color: var(--text-secondary); }
    .estacao-tag.inverno { background: var(--info-subtle); color: var(--info); }

    .narrativa-texto {
      font-size: 14px;
      line-height: 1.7;
      color: var(--text);
      margin: 0 0 14px 0;
    }
    .narrativa-texto .destaque { color: var(--accent); font-weight: 600; }
    .narrativa-texto .destaque-bom { color: var(--success); font-weight: 600; }
    .narrativa-texto .destaque-ruim { color: var(--danger); font-weight: 600; }
    .narrativa-texto .destaque-alerta { color: var(--warning); font-weight: 600; }
    .narrativa-texto .acao-nome {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      background: var(--surface-3);
      padding: 1px 6px;
      border-radius: 4px;
    }
    .narrativa-texto .agente-nome {
      font-weight: 600;
      color: var(--text);
    }

    /* Box de dados do turno */
    .dados-box {
      margin-top: 14px;
      padding: 12px;
      background: var(--surface-2);
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }
    .dados-box-titulo {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dados-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 8px;
      font-size: 12px;
    }
    .dado-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .dado-label {
      color: var(--text-muted);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .dado-valor {
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      font-size: 13px;
    }
    .dado-valor.bom { color: var(--success); }
    .dado-valor.ruim { color: var(--danger); }
    .dado-valor.alerta { color: var(--warning); }

    /* Citacoes dos agentes */
    .citacoes {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--border);
    }
    .citacao {
      padding: 6px 10px;
      margin: 4px 0;
      background: var(--surface-3);
      border-left: 2px solid var(--accent);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      font-size: 12px;
      color: var(--text-secondary);
      font-style: italic;
    }
    .citacao .quem {
      font-style: normal;
      font-weight: 600;
      color: var(--text);
      margin-right: 6px;
    }
    .citacao .intencao {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 6px;
      background: var(--accent-subtle);
      color: var(--accent);
      border-radius: 8px;
      font-size: 10px;
      font-style: normal;
      font-family: 'JetBrains Mono', monospace;
    }

    /* Hero do inicio */
    .hero {
      background: linear-gradient(135deg, var(--surface) 0%, var(--surface-2) 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px 28px;
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute;
      top: -50%; right: -10%;
      width: 300px; height: 300px;
      background: radial-gradient(circle, var(--accent-subtle) 0%, transparent 70%);
      pointer-events: none;
    }
    .hero-titulo {
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
      margin: 0 0 8px 0;
      letter-spacing: -0.02em;
      position: relative;
    }
    .hero-subtitulo {
      font-size: 14px;
      color: var(--text-secondary);
      margin: 0 0 16px 0;
      position: relative;
    }
    .hero-meta {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--text-muted);
      position: relative;
    }
    .hero-meta span {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .hero-meta strong { color: var(--text); font-weight: 600; }

    /* Loading */
    .loading {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
      font-size: 14px;
    }
    .loading::after {
      content: '...';
      animation: dots 1.5s infinite;
    }
    @keyframes dots {
      0%, 20% { content: '.'; }
      40% { content: '..'; }
      60%, 100% { content: '...'; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Aldeia de Agentes — História</h1>
    <nav>
      <a href="index.html">Início</a>
      <a href="jogo.html">Jogo</a>
      <a href="agentes.html">Agentes</a>
      <a href="config.html">Configuração</a>
      <a href="analise.html">Análise</a>
      <a href="historia.html" class="active">História</a>
      <a href="ranking.html">Ranking</a>
    </nav>
  </header>
  <main>
    <section class="card">
      <h2>📜 História da partida</h2>
      <p class="text-sm text-secondary" style="margin: 8px 0 16px 0">
        Uma narrativa lúdica do que aconteceu, com dados de cada turno.
      </p>
      <label>ID da partida: <input type="number" id="f-pid" value="1"></label>
      <button id="btn-carregar" class="primary">Contar a história</button>
    </section>

    <div id="historia" hidden>
      <!-- Hero + capítulos serão inseridos aqui -->
    </div>

    <div id="loading" class="loading" hidden>Carregando</div>
  </main>

  <script src="js/api.js?v=14"></script>
  <script src="js/historia.js?v=14"></script>
</body>
</html>
